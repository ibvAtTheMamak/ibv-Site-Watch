name: Site Watch

on:
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test alert instead of checking sites"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEAMS_WEBHOOK_TEAM: ${{ secrets.TEAMS_WEBHOOK_TEAM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python monitor.py ${{ inputs.test_notify && '--test-notify' || '' }}

      - name: Save state
        if: ${{ !cancelled() && !inputs.test_notify }}
        run: |
          git config user.name "site-watch-bot"
          git config user.email "site-watch-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "Update seen links [skip ci]"
          git push
