name: Site Watch

on:
  schedule:
    - cron: "17,47 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test alert instead of checking sites"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          # All repo secrets are passed so each watcher can name its own webhook secret.
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: python monitor.py ${{ inputs.test_notify && '--test-notify' || '' }}

      - name: Save state
        if: ${{ !cancelled() && !inputs.test_notify }}
        run: |
          git config user.name "site-watch-bot"
          git config user.email "site-watch-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "Update seen links [skip ci]"
          git push
